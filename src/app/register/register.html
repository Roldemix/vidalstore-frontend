<div class="register-container">

  @if (step === 'register') {
    <h2>Crear cuenta</h2>

    <form (ngSubmit)="onRegister()">
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
        />
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creando cuenta...' : 'Registrarse' }}
      </button>
    </form>
  }

  @if (step === 'confirm') {
    <h2>Confirma tu cuenta</h2>
    <p>Te enviamos un código a {{ email }}. Ingrésalo abajo:</p>

    <form (ngSubmit)="onConfirm()">
      <div>
        <label for="code">Código de confirmación</label>
        <input
          type="text"
          id="code"
          name="code"
          [(ngModel)]="confirmationCode"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Confirmando...' : 'Confirmar' }}
      </button>
    </form>
  }

</div>
